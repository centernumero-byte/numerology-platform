<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Numerology Platform</title>
<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  padding: 0;
  min-height: 100%;
}

body {
  background:
    radial-gradient(circle at 70% 15%, rgba(142, 73, 181, 0.22), transparent 28%),
    radial-gradient(circle at 20% 80%, rgba(104, 54, 151, 0.18), transparent 30%),
    linear-gradient(135deg, #17102f 0%, #211443 45%, #17102f 100%);
  color: #f8e7a8;
  font-family: Arial, sans-serif;
  visibility: hidden;
}

/* ===================== ПЛАТФОРМА ===================== */

.platform {
  min-height: 100vh;
  display: flex;
  padding: 8px;
}

/* Левое меню */

.sidebar {
  width: 245px;
  min-height: calc(100vh - 16px);
  padding: 28px 18px 24px;
  border: 1px solid rgba(220, 169, 42, 0.65);
  border-radius: 18px 0 0 18px;
  background:
    radial-gradient(circle at 50% 10%, rgba(135, 64, 175, 0.30), transparent 28%),
    linear-gradient(180deg, #21143d 0%, #17112f 100%);
  display: flex;
  flex-direction: column;
}

.logo { text-align: center; margin-bottom: 38px; }

.logo-symbol {
  width: 100px; height: 100px; margin: 0 auto 14px;
  border-radius: 50%; border: 2px solid #e7bd43;
  display: flex; align-items: center; justify-content: center;
  color: #f5d46b; font-size: 48px;
  box-shadow: 0 0 20px rgba(225, 184, 64, 0.35), inset 0 0 20px rgba(225, 184, 64, 0.12);
}

.logo-title { font-family: Georgia, serif; font-size: 25px; color: #f5d46b; letter-spacing: 1px; }
.logo-subtitle { margin-top: 8px; font-size: 20px; color: #e7bd43; }

.nav { display: flex; flex-direction: column; gap: 12px; }

.nav-item {
  width: 100%; min-height: 52px; padding: 15px 16px;
  border-radius: 12px; border: 1px solid transparent;
  background: transparent; color: #f5f0df;
  font-size: 18px; line-height: 1.2; text-align: left; cursor: pointer;
  transition: background 0.25s, border-color 0.25s, color 0.25s;
  display: flex; align-items: center;
}
.nav-item:hover { background: rgba(126, 66, 164, 0.25); border-color: rgba(218, 173, 49, 0.55); }
.nav-item.active {
  background: linear-gradient(90deg, rgba(113, 49, 153, 0.55), rgba(93, 39, 137, 0.35));
  border-color: #d7aa31; color: #f8d96d;
  box-shadow: 0 0 15px rgba(212, 164, 43, 0.12);
}
.nav-icon {
  display: inline-flex; width: 32px; min-width: 32px; margin-right: 2px;
  align-items: center; justify-content: center; color: #f2c84d; font-size: 22px;
}
.logout { margin-top: auto; color: #f5d46b; }

/* Основная область */

.main {
  flex: 1; min-height: calc(100vh - 16px);
  padding: 42px 30px 36px;
  border: 1px solid rgba(220, 169, 42, 0.65); border-left: none;
  border-radius: 0 18px 18px 0;
  background:
    radial-gradient(circle at 55% 5%, rgba(146, 73, 182, 0.23), transparent 28%),
    radial-gradient(circle at 90% 85%, rgba(111, 57, 157, 0.16), transparent 30%),
    #21163f;
}

.top { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 28px; }
.welcome h1 { margin: 0; font-family: Georgia, serif; font-size: 43px; font-weight: 500; color: #f8dc78; }
.account { display: flex; align-items: center; gap: 12px; color: #f4e9cc; font-size: 16px; }
.account-icon {
  width: 45px; height: 45px; border: 1px solid #e3b936; border-radius: 50%;
  display: flex; align-items: center; justify-content: center; color: #f4c94f; font-size: 23px;
}

/* Карточки направлений */

.cards {
  display: grid;
  grid-template-columns: repeat(5, 180px);
  gap: 20px;
  justify-content: start;
  align-items: start;
  width: 100%;
  margin-top: 18px;
}

.cards .card, .method-card {
  width: 180px; height: 250px; min-height: 250px; box-sizing: border-box;
  padding: 18px 14px; border: 1px solid rgba(225, 180, 52, 0.9); border-radius: 18px;
  background:
    radial-gradient(circle at 50% 10%, rgba(130, 65, 169, 0.30), transparent 40%),
    linear-gradient(145deg, #302052 0%, #21163d 100%);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  text-align: center; cursor: pointer; overflow: hidden;
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.18), inset 0 0 30px rgba(126, 65, 167, 0.08);
  transition: transform 0.25s, box-shadow 0.25s;
}
.cards .card:hover, .method-card:hover {
  transform: translateY(-4px);
  box-shadow: 0 14px 35px rgba(0, 0, 0, 0.25), 0 0 22px rgba(222, 174, 47, 0.12);
}
.method-card:not([onclick]) { cursor: default; }

.cards .card-icon {
  height: 65px; margin-bottom: 12px; display: flex; align-items: center; justify-content: center;
  font-size: 52px; line-height: 1; color: #f2c94c;
  text-shadow: 0 0 20px rgba(239, 192, 62, 0.3);
}
.cards .card-content h3 { margin: 0 0 9px; font-family: Georgia, serif; font-size: 20px; line-height: 1.12; font-weight: 500; color: #f6d66c; }
.cards .card-content p { margin: 0; font-size: 14px; line-height: 1.3; color: #eee5d0; }

.card.has-material { border-color: #8fe3a1; }

.pythagoras-icon {
  display: grid !important; grid-template-columns: repeat(3, 1fr); gap: 3px 8px;
  width: 88px; height: 65px !important; font-size: 17px !important; line-height: 1 !important;
}
.pythagoras-icon span { display: flex; align-items: center; justify-content: center; }

.library-icon { font-size: 54px !important; line-height: 1; height: 65px !important; display: flex; align-items: center; justify-content: center; }

.section-title { width: 100%; margin: 0 0 20px; }
.section-title h2 { margin: 0; font-family: Georgia, serif; font-size: 31px; font-weight: 500; color: #f6d66c; }

.back-link {
  display: inline-flex; align-items: center; gap: 8px;
  color: #f6d66c; background: none; border: none; cursor: pointer;
  font-size: 16px; margin-bottom: 14px; padding: 0;
}

/* Дашборд-блоки (доступы / статистика / мои расчёты) */

.dashboard-wrap { width: 100%; }
.dashboard-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 20px; margin-bottom: 22px; }
.dashboard-head h2 { margin: 0 0 8px; font-family: Georgia, serif; font-size: 31px; color: #f6d66c; }
.dashboard-head p { margin: 0; color: #eee5d0; font-size: 16px; }
.dashboard-badge {
  border: 1px solid rgba(225,180,52,.75); border-radius: 999px; padding: 8px 14px;
  color: #f6d66c; background: rgba(255,255,255,.05); white-space: nowrap;
}

.stats-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; margin-bottom: 18px; }
.stat-card, .table-card {
  border: 1px solid rgba(225,180,52,.65); border-radius: 16px;
  background: linear-gradient(145deg, rgba(48,32,82,.92), rgba(33,22,61,.92));
  box-shadow: inset 0 0 25px rgba(126,65,167,.08);
}
.stat-card { padding: 18px; }
.stat-card span { display: block; color: #eee5d0; font-size: 14px; margin-bottom: 8px; }
.stat-card strong { display: block; color: #f6d66c; font-family: Georgia, serif; font-size: 30px; }
.table-card { padding: 18px; overflow-x: auto; }
.table-title { color: #f6d66c; font-family: Georgia, serif; font-size: 22px; margin-bottom: 14px; }
.data-table { width: 100%; border-collapse: collapse; color: #eee5d0; }
.data-table th, .data-table td { padding: 12px 10px; border-bottom: 1px solid rgba(225,180,52,.18); text-align: left; }
.data-table th { color: #f6d66c; font-weight: 600; }
.empty-table { padding: 28px 10px; color: #d9d0bd; text-align: center; }

.access-locked { width: 100%; text-align: center; padding: 55px 30px; }
.access-locked-icon { font-size: 55px; margin-bottom: 15px; }
.access-locked h2 { font-family: Georgia, serif; font-size: 27px; color: #f6d66c; margin-bottom: 12px; }
.access-locked p { font-size: 17px; color: #eee5d0; line-height: 1.6; max-width: 650px; margin: 0 auto; }

/* ===================== СПИСОК МАТЕРИАЛОВ (полноценная страница) ===================== */

.materials-page { width: 100%; }

.materials-head {
  display: flex; justify-content: space-between; align-items: center;
  margin-bottom: 18px; flex-wrap: wrap; gap: 14px;
}
.materials-head h2 { margin: 0; font-family: Georgia, serif; font-size: 27px; color: #f6d66c; }

.materials-add-btn {
  padding: 12px 20px; border-radius: 10px; border: 1px solid #d7aa31;
  background: linear-gradient(90deg, #713199, #5d2789);
  color: #f8d96d; cursor: pointer; font-size: 15px;
}

.materials-tabs { display: flex; gap: 8px; margin-bottom: 18px; flex-wrap: wrap; }
.materials-tab {
  padding: 9px 16px; border-radius: 10px; border: 1px solid rgba(225,180,52,.4);
  background: rgba(255,255,255,.03); color: #eee5d0; cursor: pointer; font-size: 14px;
}
.materials-tab.active { background: rgba(113,49,153,.55); border-color: #d7aa31; color: #f8d96d; }

.material-row {
  display: flex; align-items: center; gap: 16px;
  padding: 16px; border-radius: 14px; margin-bottom: 12px;
  border: 1px solid rgba(225,180,52,.35);
  background: linear-gradient(145deg, rgba(48,32,82,.75), rgba(33,22,61,.75));
}
.material-row-icon {
  width: 46px; height: 46px; border-radius: 10px; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center; font-size: 20px;
  background: rgba(255,255,255,.06); color: #f2c94c;
}
.material-row-body { flex: 1; min-width: 0; }
.material-row-title { color: #f8e7a8; font-size: 16px; margin-bottom: 4px; }
.material-row-meta { color: #b8ad98; font-size: 13px; }
.material-row-open {
  padding: 10px 18px; border-radius: 10px; border: 1px solid #d7aa31;
  background: linear-gradient(90deg, #713199, #5d2789); color: #f8d96d;
  cursor: pointer; font-size: 14px; white-space: nowrap; text-decoration: none;
}
.materials-note { color: #b8ad98; font-size: 13px; margin-top: 10px; }

/* ===================== ОКНО ДОБАВЛЕНИЯ МАТЕРИАЛА ===================== */

.material-manager-overlay {
  position: fixed; inset: 0; z-index: 99999; display: flex;
  align-items: center; justify-content: center; padding: 20px;
  background: rgba(0, 0, 0, 0.72);
}
.material-manager {
  width: 560px; max-width: 95vw; max-height: 90vh; overflow-y: auto; padding: 30px;
  border-radius: 20px; background: linear-gradient(145deg, #302052, #21163d);
  border: 1px solid #d7aa31; color: #f8e7a8; box-shadow: 0 20px 70px rgba(0, 0, 0, 0.5);
}
.material-manager h2 { margin: 0 35px 24px 0; color: #f6d66c; font-family: Georgia, serif; }
.material-manager-close { float: right; background: none; border: none; color: #f6d66c; font-size: 30px; line-height: 1; cursor: pointer; }
.material-manager-label { display: block; margin: 16px 0 8px; color: #eee5d0; }
.material-manager-input {
  width: 100%; box-sizing: border-box; padding: 13px; margin-bottom: 12px;
  border-radius: 10px; border: 1px solid rgba(225, 180, 52, 0.5);
  background: rgba(0,0,0,.2); color: #fff; outline: none; font-size: 16px;
}
.material-manager-input::placeholder { color: #aaa1b4; }
.material-manager-button {
  width: 100%; margin-top: 4px; padding: 13px 16px; border-radius: 10px; border: 1px solid #d7aa31;
  background: linear-gradient(90deg, #713199, #5d2789); color: #f8d96d; cursor: pointer; font-size: 16px;
}
.material-manager-button:disabled { opacity: .55; cursor: wait; }
.material-manager-or { margin: 18px 0 4px; text-align: center; color: #c8bca4; }
.material-manager-status { margin-top: 18px; line-height: 1.45; }
.material-manager-status.ok { color: #a9e4b4; }
.material-manager-status.error { color: #ffb0b0; }
.material-manager-hint { margin-top: 8px; color: #bdb3c5; font-size: 13px; line-height: 1.4; }

/* ===================== АВТОРИЗАЦИЯ ===================== */

.auth-shell {
  min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 30px;
  background:
    radial-gradient(circle at 50% 20%, rgba(142, 73, 181, 0.22), transparent 30%),
    linear-gradient(135deg, #17102f, #211443, #17102f);
}
.auth-card {
  width: 420px; max-width: 100%; padding: 38px;
  border: 1px solid rgba(225, 180, 52, 0.7); border-radius: 20px;
  background: linear-gradient(145deg, #302052, #21163d);
  box-shadow: 0 20px 70px rgba(0, 0, 0, 0.4); text-align: center;
}
.auth-card-register { width: 600px; }
.auth-symbol { font-size: 48px; color: #f5d46b; margin-bottom: 8px; }
.auth-title { font-family: Georgia, serif; font-size: 28px; color: #f5d46b; }
.auth-subtitle { color: #e7bd43; margin-top: 5px; margin-bottom: 25px; }
.auth-card h2 { color: #f6d66c; font-family: Georgia, serif; font-weight: 500; }
.auth-card input {
  width: 100%; padding: 14px; margin: 7px 0; border: 1px solid rgba(225, 180, 52, 0.4);
  border-radius: 10px; background: rgba(0, 0, 0, 0.18); color: #fff; font-size: 16px; outline: none;
}
.auth-card button {
  width: 100%; padding: 14px; margin-top: 12px; border: 1px solid #d7aa31; border-radius: 10px;
  background: linear-gradient(90deg, #713199, #5d2789); color: #f8d96d; font-size: 16px; cursor: pointer;
}
.auth-link { background: transparent !important; border: none !important; color: #d9cba8 !important; }
.auth-divider { margin: 15px 0; color: #a99d83; }
.auth-register { background: transparent !important; }
.auth-description { color: #ddd4c1; line-height: 1.5; }
.auth-message { margin-top: 14px; min-height: 22px; line-height: 1.4; }
.auth-message.error { color: #ff9b9b; }
.auth-message.success { color: #a8e6b0; }
.auth-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 10px; }

/* ===================== АДАПТАЦИЯ ===================== */

@media (max-width: 1200px) {
  .sidebar { width: 210px; }
  .cards { grid-template-columns: repeat(3, 180px); }
}
@media (max-width: 900px) {
  .stats-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 800px) {
  .platform { display: block; }
  .sidebar { width: 100%; min-height: auto; border-radius: 18px 18px 0 0; }
  .main { border-left: 1px solid rgba(220, 169, 42, 0.65); border-top: none; border-radius: 0 0 18px 18px; }
  .cards { grid-template-columns: repeat(2, 180px); }
  .top { display: block; }
  .account { margin-top: 20px; }
  .auth-grid { grid-template-columns: 1fr; }
}
@media (max-width: 520px) {
  .main { padding: 28px 15px 25px; }
  .welcome h1 { font-size: 31px; }
  .cards { grid-template-columns: 1fr; justify-items: center; }
  .cards .card, .method-card { width: 100%; max-width: 320px; }
  .stats-grid { grid-template-columns: 1fr; }
  .material-row { flex-wrap: wrap; }
  .material-row-body { flex-basis: 100%; order: 1; }
  .material-row-icon { order: 0; }
  .material-row-open { order: 2; margin-left: 0 !important; }
}

/* ===================== АККОРДЕОН РЕЗУЛЬТАТА РАСЧЁТА ===================== */

.accordion-item {
  border: 1px solid rgba(225,180,52,.4);
  border-radius: 12px;
  margin-bottom: 10px;
  overflow: hidden;
}
.accordion-header {
  width: 100%;
  text-align: left;
  padding: 14px 16px;
  background: rgba(255,255,255,.04);
  border: none;
  color: #f6d66c;
  font-family: Georgia, serif;
  font-size: 17px;
  cursor: pointer;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.accordion-header:hover { background: rgba(255,255,255,.08); }
.accordion-body {
  padding: 16px;
  border-top: 1px solid rgba(225,180,52,.25);
  color: #eee5d0;
  line-height: 1.6;
  white-space: pre-wrap;
}
.accordion-body.hidden { display: none; }
.test-option {
  display: flex;
  align-items: center;
  gap: 14px;
  width: 100%;
  text-align: left;
  padding: 14px 16px;
  margin-bottom: 10px;
  border: 1px solid rgba(225,180,52,.35);
  border-radius: 12px;
  background: rgba(255,255,255,.03);
  color: #f8e7a8;
  font-size: 15px;
  cursor: pointer;
  transition: background .15s, border-color .15s;
}
.test-option:hover { background: rgba(255,255,255,.08); }
.test-option.selected {
  background: rgba(215,170,49,.22);
  border-color: #d7aa31;
}
.test-option-letter {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 28px;
  height: 28px;
  flex-shrink: 0;
  border-radius: 50%;
  border: 1px solid rgba(225,180,52,.5);
  color: #f6d66c;
  font-family: Georgia, serif;
  font-size: 14px;
}
.test-option.selected .test-option-letter {
  background: #d7aa31;
  color: #1a1030;
}
.key-numbers-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
  gap: 10px;
}
.key-number-box {
  padding: 10px 12px;
  border-radius: 8px;
  background: rgba(255,255,255,.04);
  border: 1px solid rgba(225,180,52,.25);
}
.key-number-box strong { display: block; font-size: 22px; color: #f6d66c; }
.key-number-box span { font-size: 12px; color: #b8ad98; }

</style>
</head>

      <div class="logo-symbol">✧</div>

/* ============================================================
   SUPABASE

const SUPABASE_URL = "https://skvprhqsxnlacshucncq.supabase.co";
const SUPABASE_KEY = "sb_publishable_N0pKMmzNOonoInimmkding_GJnMwsRd";
const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

/* ============================================================
   ГЛОБАЛЬНЫЕ ПРАВА ПОЛЬЗОВАТЕЛЯ

window.currentUserRole = "";
window.currentUserIsManager = false;
window.currentUserHasAccess = false;
window.currentUser = null;

const ADMIN_EMAILS = ["centernumero@gmail.com"];
const MANAGER_ROLES = ["admin", "administrator", "teacher", "numerologist", "нумеролог", "администратор"];

function isManagerRole(role) {
  return MANAGER_ROLES.includes(String(role || "").trim().toLowerCase());
}
function isAdminEmail(email) {
  return ADMIN_EMAILS.includes(String(email || "").trim().toLowerCase());
}
function hasActivePlatformAccess(access) {
  if (!access) return false;
  if (String(access.status || "").toLowerCase() !== "active") return false;
  if (access.payment_status && String(access.payment_status).toLowerCase() !== "paid") return false;
  if (!access.is_unlimited && access.ends_at && new Date(access.ends_at) < new Date()) return false;
  return true;
}
function escapeHtml(value) {
  return String(value || "")
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;").replace(/'/g, "&#039;");
}
function showNoAccessMessage() {

window.currentUserGrant = {};

function itemGrantActive(item) {
  if (!item || !item.granted) return false;
  if (item.unlimited) return true;
  if (!item.ends_at) return true;
  return new Date(item.ends_at) >= new Date();
}

function hasGrant(section, direction) {
  if (window.currentUserIsManager) return true;
  const scope = window.currentUserGrant || {};
  if (section === "library") return itemGrantActive(scope.library);
  if (section === "my-calculations") return itemGrantActive(scope.my_calculations);
  if (!direction) return false;
  return itemGrantActive(scope[direction] && scope[direction][section]);
}

async function showSection(section) {
  const contentCards = document.getElementById("contentCards");
  if (!contentCards) return;

  showWelcome();
  setActiveSection(section);

  // Центр Нумера всегда администратор, независимо от того, что успело подгрузиться.
  let isAdmin = window.currentUserIsManager === true;
  try {
    const { data: { session } } = await supabaseClient.auth.getSession();
    if (isAdminEmail(session?.user?.email)) {
      isAdmin = true;
      window.currentUserIsManager = true;
      window.currentUserHasAccess = true;
      window.currentUserRole = "admin";
    }
  } catch (e) {
    console.error("Ошибка проверки администратора:", e);
  }

  const protectedSections = ["calculators", "manuals", "videos", "tests", "library", "my-calculations"];
  if (!isAdmin && protectedSections.includes(section)) {
    if (!window.currentUserHasAccess) { renderLockedSection(section); return; }
    if ((section === "library" || section === "my-calculations") && !hasGrant(section)) {
      renderLockedSection(section);
      return;
    }
  }

  if (section === "calculators") { renderCalculators(); return; }
  if (section === "manuals") { await loadPlatformMaterials("manuals"); return; }
  if (section === "videos") { await loadPlatformMaterials("videos"); return; }
  if (section === "tests") { await loadTestsHub(); return; }
  if (section === "library") { loadLibrary(); return; }
  if (section === "my-calculations") { renderMyCalculations(); return; }
  if (section === "access") { await renderAccess(); return; }
  if (section === "statistics") {
    if (!isAdmin && !window.currentUserIsManager) { renderLockedSection(section); return; }
    await renderStatistics();
    return;
  }
}

function formatBirthDate(input) {
  let value = input.value.replace(/\D/g, "");
  if (value.length > 8) value = value.substring(0, 8);
  if (value.length > 4) value = value.substring(0, 2) + "." + value.substring(2, 4) + "." + value.substring(4);
  else if (value.length > 2) value = value.substring(0, 2) + "." + value.substring(2);
  input.value = value;
}

function isValidBirthDate(value) {
  const match = String(value || "").match(/^(\d{2})\.(\d{2})\.(\d{4})$/);
  if (!match) return false;
  const day = Number(match[1]), month = Number(match[2]), year = Number(match[3]);
  if (year < 1900 || year > 2100) return false;
  const date = new Date(year, month - 1, day);
  return date.getFullYear() === year && date.getMonth() === month - 1 && date.getDate() === day;
}

function calculate(type) {
  const name = document.getElementById("name")?.value.trim();
  const birthDate = document.getElementById("birthDate")?.value.trim();
  const dateError = document.getElementById("dateError");
  const result = document.getElementById("result");
  if (dateError) dateError.textContent = "";
  if (result) result.innerHTML = "";

  if (!name) { if (dateError) dateError.textContent = "Введите имя."; return; }
  if (!isValidBirthDate(birthDate)) {
    if (dateError) dateError.textContent = "Введите корректную дату рождения в формате ДД.ММ.ГГГГ.";
    return;
  }
  if (!result) return;

  if (type === "adult" && window.AdultMatrixEngine) {
    renderAdultMatrixResult(name, birthDate, result);
    return;
  }
  if (type === "child" && window.ChildMatrixEngine) {
    renderChildMatrixResult(name, birthDate, result);
    return;
  }
  if (type === "vedic" && window.VedicEngine) {
    renderVedicResult(name, birthDate, result);
    return;
  }

  result.innerHTML = `
    <div style="padding:20px;border:1px solid rgba(225,180,52,.5);border-radius:14px;background:rgba(0,0,0,.12);">
      <h3 style="margin-top:0;color:#f6d66c;font-family:Georgia,serif;">${DIRECTION_NAMES[type] || "Расчёт"}</h3>

    </div>`;
}

function renderAdultMatrixResult(name, birthDate, container) {
  const [day, month, year] = birthDate.split(".").map(Number);

  let res;
  try {
    res = window.AdultMatrixEngine.getFullResult(day, month, year, name);
  } catch (error) {
    console.error("Ошибка расчёта матрицы:", error);
    container.innerHTML = `<div style="color:#ff9d9d;padding:16px;">Не удалось выполнить расчёт: ${escapeHtml(error.message || String(error))}</div>`;
    return;
  }

  let idCounter = 0;
  const nextId = () => "acc-" + (idCounter++);

  function accordionItem(title, bodyHtml) {
    const id = nextId();
    return `
      <div class="accordion-item">
        <button type="button" class="accordion-header" onclick="toggleAccordionBody('${id}')">
          <span>${escapeHtml(title)}</span><span>▾</span>
        </button>
        <div class="accordion-body hidden" id="${id}">${bodyHtml}</div>
      </div>`;
  }

  let editKeyCounter = 0;
  function editableDiv(text) {
    const key = "adult-" + (editKeyCounter++);
    return `<div class="editable-text" contenteditable="false" data-key="${key}" style="margin:0 0 18px;padding:6px;border-radius:6px;outline:none;">${escapeHtml(text)}</div>`;
  }

  const rasshifrovkaHtml = res.rasshifrovka.map(function (block) {

        ? `<p style="color:#f6d66c;font-family:Georgia,serif;font-size:20px;margin:0 0 4px;">${escapeHtml(String(e.number))}</p>`
        : "";
      return `${numberLine}${editableDiv(e.text)}`;
    }).join("");
    return accordionItem(block.title, body);
  }).join("");

  // Карта здоровья: заголовок чакры -> вводный текст -> (Физика/Энергия/Эмоции: число, текст), с цветным маркером чакры.

    const introHtml = block.intro.map(function (t) {
      return `<p style="margin:0 0 14px;">${escapeHtml(t)}</p>`;

function downloadAdultMatrixText(name, birthDate) {
  const res = window._lastAdultMatrixResult;
  if (!res) return;

  // Подтягиваем возможные правки из полей на странице по порядку их появления.
  const editedTexts = [];
  document.querySelectorAll(".editable-text").forEach(function (el) { editedTexts.push(el.innerText); });
  let cursor = 0;
  let text = `Матрица судьбы — ${name} (${birthDate})\n\n`;

  res.rasshifrovka.forEach(function (block) {
    text += "== " + block.title + " ==\n";
    block.entries.forEach(function (e) {
      text += e.number + "\n" + (editedTexts[cursor++] ?? e.text) + "\n\n";
    });
  });

  res.health.forEach(function (block) {
    text += "== " + block.title + " ==\n";
    block.intro.forEach(function (t) { text += t + "\n\n"; });
    block.entries.forEach(function (e) {
      text += e.axis + ": " + e.number + "\n" + (editedTexts[cursor++] ?? e.text) + "\n\n";
    });
  });

  if (res.programs.length) {
    text += "== Программы ==\n";
    res.programs.forEach(function (p) {
      text += (editedTexts[cursor++] ?? p.fullText) + "\n\n";
    });
  }

  downloadTextFile("Матрица судьбы - " + name + ".txt", text);
}

function calculatePythagoras() {
  const lastName = document.getElementById("pythLastName")?.value.trim();
  const firstName = document.getElementById("pythFirstName")?.value.trim();
  const patronymic = document.getElementById("pythPatronymic")?.value.trim();
  const alphabet = document.getElementById("pythAlphabet")?.value || "russian";
  const birthDate = document.getElementById("birthDate")?.value.trim();
  const dateError = document.getElementById("dateError");
  const result = document.getElementById("result");
  if (dateError) dateError.textContent = "";
  if (result) result.innerHTML = "";

  if (!lastName || !firstName) {
    if (dateError) dateError.textContent = "Введите фамилию и имя.";
    return;
  }
  if (!isValidBirthDate(birthDate)) {
    if (dateError) dateError.textContent = "Введите корректную дату рождения в формате ДД.ММ.ГГГГ.";
    return;
  }
  if (!result || !window.PythagorasEngine) return;

  const [d, m, y] = birthDate.split(".").map(Number);

  let res;
  try {
    res = window.PythagorasEngine.getFullResult(d, m, y, lastName, firstName, patronymic, alphabet);
  } catch (error) {
    console.error("Ошибка расчёта по Пифагору:", error);
    result.innerHTML = `<div style="color:#ff9d9d;padding:16px;">Не удалось выполнить расчёт: ${escapeHtml(error.message || String(error))}</div>`;
    return;
  }

  renderEditableResult(res.blocks, result, lastName + " " + firstName, birthDate);
  renderPythDigitSquare(res.digitSquare, result);
  window._lastPythagorasResult = res;
}

function renderPythDigitSquare(digitSquare, container) {
  const layout = [[1, 4, 7], [2, 5, 8], [3, 6, 9]];
  const cellsHtml = layout.map(function (row) {
    return `<div style="display:flex;gap:8px;">` + row.map(function (digit) {
      const count = digitSquare[digit] || 0;
      const repeated = count > 0 ? String(digit).repeat(count) : "—";
      return `
        <div style="flex:1;aspect-ratio:1;border:1px solid rgba(225,180,52,.5);border-radius:10px;
                    display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(255,255,255,.03);">
          <div style="font-size:11px;color:#8a8098;">число ${digit}</div>
          <div style="font-family:Georgia,serif;font-size:22px;color:#f6d66c;">${escapeHtml(repeated)}</div>
        </div>`;
    }).join("") + `</div>`;
  }).join("");

  const box = document.createElement("div");
  box.style.cssText = "max-width:300px;margin:0 auto 30px;display:flex;flex-direction:column;gap:8px;";
  box.innerHTML = `<div style="text-align:center;color:#c9bfa8;font-size:14px;margin-bottom:6px;">Ваш квадрат Пифагора</div>` + cellsHtml;
  container.insertBefore(box, container.firstChild);
}

async function downloadTextFile(filename, text) {
  const blob = new Blob([text], { type: "text/plain;charset=utf-8" });

  // На iPhone/iPad обычный <a download> часто просто открывает файл вместо скачивания.
  // Пытаемся сначала через нативное меню «Поделиться» — там есть «Сохранить в Файлы».
  if (navigator.canShare && navigator.share) {
    try {
      const file = new File([blob], filename, { type: "text/plain" });
      if (navigator.canShare({ files: [file] })) {
        await navigator.share({ files: [file], title: filename });
        return;
      }
    } catch (err) {
      // Пользователь мог отменить — тогда просто пробуем обычный способ ниже.
      if (err && err.name === "AbortError") return;
    }
  }

  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}

function downloadEditableResult(personLabel, dateLabel) {
  const blocks = window._lastEditableBlocks;
  if (!blocks) return;

  // Подтягиваем возможные правки прямо из отредактированных полей на странице.
  document.querySelectorAll(".editable-text").forEach(function (el) {
    const b = Number(el.dataset.block), e = Number(el.dataset.entry);
    if (blocks[b] && blocks[b].entries[e]) {
      blocks[b].entries[e].text = el.innerText;
    }
  });

  let text = dateLabel ? `${personLabel} (${dateLabel})\n\n` : `${personLabel}\n\n`;
  blocks.forEach(function (block) {
    text += "== " + block.title + " ==\n";
    block.entries.forEach(function (e) {
      text += (typeof e.number === "number" ? e.number + "\n" : "") + e.text + "\n\n";
    });
  });

  downloadTextFile(personLabel + (dateLabel ? " - " + dateLabel : "") + ".txt", text);
}

const TEST_QUESTIONS_TABLE = "test_questions";
const TEST_ATTEMPTS_TABLE = "test_attempts";

let testState = null; // { direction, title, questions, currentIndex, answers }

async function loadTestsHub() {

function testPageShell(innerHtml) {

async function openTestDirection(direction, title) {
  testPageShell(`
    <button onclick="location.reload()" style="background:none;border:none;color:#d7aa31;cursor:pointer;font-size:14px;margin-bottom:16px;">← Назад</button>
    <h1 style="color:#f6d66c;font-family:Georgia,serif;font-weight:500;">${escapeHtml(title)} — тест</h1>
    <div id="testIntroBox">Загрузка...</div>`);

  try {
    const { count, error: countError } = await supabaseClient
      .from(TEST_QUESTIONS_TABLE)
      .select("id", { count: "exact", head: true })
      .eq("direction", direction);
    if (countError) throw countError;

    const { data: { session } } = await supabaseClient.auth.getSession();
    let historyHtml = "";
    if (session) {
      const { data: attempts } = await supabaseClient
        .from(TEST_ATTEMPTS_TABLE)
        .select("score, total_questions, completed_at")
        .eq("user_id", session.user.id)
        .eq("direction", direction)
        .order("completed_at", { ascending: false })
        .limit(5);
      if (attempts && attempts.length) {
        historyHtml = `
          <div style="margin-top:24px;">
            <div style="color:#c9bfa8;font-size:14px;margin-bottom:8px;">Ваши прошлые попытки:</div>
            ${attempts.map(a => `
              <div style="display:flex;justify-content:space-between;padding:8px 12px;border-bottom:1px solid rgba(225,180,52,.15);font-size:14px;">
                <span>${new Date(a.completed_at).toLocaleString("ru-RU", { day: "2-digit", month: "2-digit", year: "numeric", hour: "2-digit", minute: "2-digit" })}</span>
                <span style="color:#f6d66c;">${a.score} из ${a.total_questions}</span>
              </div>`).join("")}
          </div>`;
      }
    }

    const box = document.getElementById("testIntroBox");
    if (!count) {
      box.innerHTML = `<div class="table-card"><div class="empty-table">Вопросы для этого теста пока не добавлены.</div></div>`;
      return;
    }

    box.innerHTML = `

  }

async function startTest(direction, title) {
  testPageShell(`<p>Загрузка вопросов...</p>`);

  try {
    const { data, error } = await supabaseClient
      .from(TEST_QUESTIONS_TABLE)
      .select("id, question_order, question_text, option_a, option_b, option_c, option_d, correct_option")
      .eq("direction", direction)
      .order("question_order", { ascending: true });
    if (error) throw error;
    if (!data || !data.length) {
      testPageShell(`<div class="table-card"><div class="empty-table">Вопросы не найдены.</div></div>`);
      return;
    }

    testState = { direction, title, questions: data, currentIndex: 0, answers: {} };
    renderTestQuestion();
  } catch (error) {
    console.error("Ошибка запуска теста:", error);
    testPageShell(`<div class="table-card"><div class="empty-table">Не удалось загрузить вопросы.</div></div>`);
  }
}

function renderTestQuestion() {
  if (!testState) return;
  const { questions, currentIndex, answers, title } = testState;
  const q = questions[currentIndex];
  const total = questions.length;
  const selected = answers[q.id];
  const isLast = currentIndex === total - 1;
  const answeredCount = Object.keys(answers).length;

  const options = [["a", q.option_a], ["b", q.option_b], ["c", q.option_c], ["d", q.option_d]];

  testPageShell(`
      <button onclick="if(confirm('Прервать тест? Прогресс не сохранится.')) location.reload()" style="background:none;border:none;color:#d7aa31;cursor:pointer;font-size:14px;margin-bottom:16px;">← Прервать тест</button>
      <div>
        <div style="color:#c9bfa8;font-size:14px;margin-bottom:6px;">${escapeHtml(title)} · Вопрос ${currentIndex + 1} из ${total}</div>
        <div style="height:4px;background:rgba(255,255,255,.1);border-radius:2px;margin-bottom:20px;overflow:hidden;">
          <div style="height:100%;width:${((currentIndex + 1) / total) * 100}%;background:#d7aa31;"></div>
        </div>

        <h2 style="color:#f6d66c;font-family:Georgia,serif;font-weight:500;font-size:20px;margin-bottom:20px;">${escapeHtml(q.question_text)}</h2>

        <div id="testOptionsBox">
          ${options.map(([letter, text]) => `
            <button type="button" class="test-option${selected === letter ? " selected" : ""}" onclick="selectTestAnswer('${letter}')">
              <span class="test-option-letter">${letter.toUpperCase()}</span>
              <span>${escapeHtml(text)}</span>
            </button>`).join("")}
        </div>

        <div style="display:flex;gap:12px;margin-top:24px;">
          ${currentIndex > 0 ? `<button class="material-manager-button" style="width:auto;background:rgba(0,0,0,.15);" onclick="goToTestQuestion(${currentIndex - 1})">← Назад</button>` : ""}
          ${!isLast ? `<button class="material-manager-button" style="width:auto;" onclick="goToTestQuestion(${currentIndex + 1})">Далее →</button>` : ""}
          ${isLast ? `<button class="material-manager-button" style="width:auto;" onclick="finishTest()">Завершить тест</button>` : ""}
        </div>

        <div style="margin-top:18px;display:flex;flex-wrap:wrap;gap:6px;">
          ${questions.map((qq, i) => `
            <button onclick="goToTestQuestion(${i})" style="width:30px;height:30px;border-radius:6px;border:1px solid rgba(225,180,52,.4);cursor:pointer;font-size:12px;
              background:${i === currentIndex ? "#d7aa31" : (answers[qq.id] ? "rgba(215,170,49,.35)" : "rgba(0,0,0,.15)")};
              color:${i === currentIndex ? "#1a1030" : "#f8e7a8"};">${i + 1}</button>`).join("")}
        </div>
        <div style="color:#8a8098;font-size:13px;margin-top:8px;">Отвечено: ${answeredCount} из ${total}</div>
      </div>`);
}

function selectTestAnswer(letter) {
  if (!testState) return;
  const q = testState.questions[testState.currentIndex];
  testState.answers[q.id] = letter;
  renderTestQuestion();
}

function goToTestQuestion(index) {
  if (!testState) return;
  testState.currentIndex = index;
  renderTestQuestion();
}

async function finishTest() {
  if (!testState) return;
  const { direction, title, questions, answers } = testState;

  const unanswered = questions.filter(q => !answers[q.id]).length;
  if (unanswered > 0 && !confirm(`Вы не ответили на ${unanswered} вопрос(ов). Завершить тест всё равно?`)) {
    return;
  }

  let score = 0;
  questions.forEach(q => { if (answers[q.id] === q.correct_option) score++; });

  testPageShell(`<p>Сохраняю результат...</p>`);

  try {
    const { data: { session } } = await supabaseClient.auth.getSession();
    if (session) {
      await supabaseClient.from(TEST_ATTEMPTS_TABLE).insert({
        user_id: session.user.id,
        direction,
        score,
        total_questions: questions.length,
        answers,
      });
    }
  } catch (error) {
    console.error("Не удалось сохранить результат теста:", error);
  }

  renderTestResult(score, questions.length, answers, questions, direction, title);
}

function renderTestResult(score, total, answers, questions, direction, title) {
  const percent = Math.round((score / total) * 100);
  const dateStr = new Date().toLocaleDateString("ru-RU");

  testPageShell(`
      <div style="text-align:center;">
        <div style="font-size:48px;margin-bottom:10px;">${percent >= 70 ? "🎉" : "📝"}</div>
        <h2 style="color:#f6d66c;font-family:Georgia,serif;font-weight:500;">Тест завершён</h2>
        <p style="font-size:24px;color:#f8e7a8;margin:10px 0;">Правильно: <strong style="color:#f6d66c;">${score} из ${total}</strong></p>
        <p style="color:#c9bfa8;font-size:14px;">Дата прохождения: ${dateStr}</p>

        <div style="display:flex;gap:12px;margin-top:24px;justify-content:center;flex-wrap:wrap;">
          <button class="material-manager-button" style="width:auto;" onclick='reviewTestAnswers(${JSON.stringify(direction)},${JSON.stringify(title)})'>Посмотреть ответы</button>
          <button class="material-manager-button" style="width:auto;" onclick='startTest(${JSON.stringify(direction)},${JSON.stringify(title)})'>Пройти ещё раз</button>

        </div>
      </div>`);

  window._lastTestReview = { questions, answers };
}

function reviewTestAnswers(direction, title) {
  const review = window._lastTestReview;
  if (!review) return;
  const { questions, answers } = review;
  const letters = { a: "A", b: "B", c: "C", d: "D" };

  testPageShell(`
      <button onclick="location.reload()" style="background:none;border:none;color:#d7aa31;cursor:pointer;font-size:14px;margin-bottom:16px;">← К списку тестов</button>
      <h2 style="color:#f6d66c;font-family:Georgia,serif;font-weight:500;">${escapeHtml(title)} — разбор ответов</h2>
      <div>
        ${questions.map((q, i) => {
          const userAns = answers[q.id];
          const isCorrect = userAns === q.correct_option;
          const options = { a: q.option_a, b: q.option_b, c: q.option_c, d: q.option_d };
          return `
            <div style="margin-bottom:20px;padding:16px;border-radius:12px;border:1px solid ${isCorrect ? "rgba(120,200,120,.4)" : "rgba(220,100,100,.4)"};background:rgba(255,255,255,.03);">
              <div style="color:#c9bfa8;font-size:13px;margin-bottom:4px;">Вопрос ${i + 1}</div>
              <div style="color:#f8e7a8;margin-bottom:10px;">${escapeHtml(q.question_text)}</div>
              <div style="font-size:14px;">
                <div style="color:${isCorrect ? "#8fd98f" : "#ff9d9d"};">Ваш ответ: ${userAns ? letters[userAns] + ") " + escapeHtml(options[userAns]) : "не отвечено"}</div>
                ${!isCorrect ? `<div style="color:#8fd98f;margin-top:4px;">Правильный ответ: ${letters[q.correct_option]}) ${escapeHtml(options[q.correct_option])}</div>` : ""}
              </div>
            </div>`;
        }).join("")}
      </div>`);
}

async function loadDirectionMaterialsList() {
  const box = document.getElementById("materialsListBox");
  if (!box || !currentMaterialsView) return;
  const { section, direction } = currentMaterialsView;

  try {
    const { data, error } = await supabaseClient
      .from(PLATFORM_MATERIALS_TABLE)
      .select("id, material_type, url, file_path, title, created_at")
      .eq("section", section)
      .eq("direction", direction)
      .order("created_at", { ascending: false });
    if (error) throw error;

    currentDirectionMaterials = data || [];

    if (!currentDirectionMaterials.length) {
      box.innerHTML = `<div class="table-card"><div class="empty-table">Материал пока не добавлен.</div></div>`;
      return;
    }

    box.innerHTML = currentDirectionMaterials.map(function (item) {
      const isLink = item.material_type === "link";
      const icon = isLink ? "🔗" : (section === "videos" ? "▶" : "📄");
      const label = isLink ? "Ссылка" : (item.title || (section === "videos" ? "Видеофайл" : "Файл"));
      const meta = isLink ? escapeHtml(item.url || "") : "";
      const date = item.created_at ? new Date(item.created_at).toLocaleDateString("ru-RU") : "";
      return `
        <div class="material-row">
          <div class="material-row-icon">${icon}</div>
          <div class="material-row-body">
            <div class="material-row-title">${escapeHtml(label)}</div>

    box.innerHTML = `<div class="table-card"><div class="empty-table">Не удалось загрузить материалы.</div></div>`;
  }
}

async function deleteMaterialById(id) {
  if (!window.currentUserIsManager) return;
  const item = currentDirectionMaterials.find(m => String(m.id) === String(id));
  if (!item) return;
  if (!confirm("Удалить этот материал безвозвратно?")) return;

  try {
    const { error } = await supabaseClient.from(PLATFORM_MATERIALS_TABLE).delete().eq("id", id);
    if (error) throw error;

    if (item.file_path) {
      await supabaseClient.storage.from(PLATFORM_STORAGE_BUCKET).remove([item.file_path]);
    }

    await loadDirectionMaterialsList();
  } catch (error) {
    console.error("Ошибка удаления материала:", error);
    alert("Не удалось удалить материал.\n\n" + (error.message || error));
  }
}

async function openMaterialById(id) {
  const item = currentDirectionMaterials.find(m => String(m.id) === String(id));
  if (!item) return;
  try {
    if (item.url) { window.open(item.url, "_blank", "noopener,noreferrer"); return; }
    if (item.file_path) {
      const { data, error } = await supabaseClient.storage
        .from(PLATFORM_STORAGE_BUCKET)
        .createSignedUrl(item.file_path, 60 * 60);
      if (error) throw error;
      if (!data?.signedUrl) throw new Error("Не удалось получить ссылку на файл.");
      window.open(data.signedUrl, "_blank", "noopener,noreferrer");
    }
  } catch (error) {
    console.error("Ошибка открытия материала:", error);
    alert("Не удалось открыть материал.\n\n" + (error.message || error));
  }
}

function setMaterialManagerStatus(text, type) {
  const box = document.getElementById("materialManagerStatus");
  if (!box) return;
  box.className = "material-manager-status " + (type || "");
  box.textContent = text || "";
}
function setMaterialManagerBusy(busy) {
  const saveButton = document.getElementById("saveMaterialUrlButton");
  const uploadButton = document.getElementById("uploadMaterialFileButton");
  if (saveButton) saveButton.disabled = busy;
  if (uploadButton) uploadButton.disabled = busy;
}

async function savePlatformMaterialUrl() {
  if (!window.currentUserIsManager) return;
  const { section, direction } = materialManagerState;
  const input = document.getElementById("materialUrlInput");
  const url = input?.value.trim() || "";

  if (!url) { setMaterialManagerStatus("Вставьте ссылку.", "error"); return; }
  try { new URL(url); } catch (_) {
    setMaterialManagerStatus("Введите корректную ссылку, начинающуюся с https:// или http://", "error");
    return;
  }

  setMaterialManagerBusy(true);
  setMaterialManagerStatus("Сохраняю ссылку...", "");

  try {
    const { data: { session } } = await supabaseClient.auth.getSession();
    if (!session) throw new Error("Сессия пользователя не найдена.");

    const { error } = await supabaseClient.from(PLATFORM_MATERIALS_TABLE).insert({
      section, direction, material_type: "link", url, file_path: null, created_by: session.user.id
    });
    if (error) throw error;

    setMaterialManagerStatus("Ссылка сохранена.", "ok");
    await loadDirectionMaterialsList();
    setTimeout(() => document.getElementById("materialManager")?.remove(), 700);
  } catch (error) {
    console.error("Ошибка сохранения ссылки:", error);
    setMaterialManagerStatus("Не удалось сохранить ссылку: " + (error.message || error), "error");
  } finally {
    setMaterialManagerBusy(false);
  }
}

async function uploadPlatformMaterialFile() {
  if (!window.currentUserIsManager) return;
  const { section, direction } = materialManagerState;
  const input = document.getElementById("materialFileInput");
  const file = input?.files?.[0];

  if (!file) { setMaterialManagerStatus("Сначала выберите файл.", "error"); return; }

  const maxSize = section === "videos" ? 500 * 1024 * 1024 : 100 * 1024 * 1024;
  if (file.size > maxSize) {
    setMaterialManagerStatus(
      section === "videos" ? "Видео слишком большое (максимум 500 МБ)." : "Файл слишком большой (максимум 100 МБ).",
      "error"
    );
    return;
  }

  setMaterialManagerBusy(true);
  setMaterialManagerStatus("Загружаю файл...", "");

  try {
    const { data: { session } } = await supabaseClient.auth.getSession();
    if (!session) throw new Error("Сессия пользователя не найдена.");

    const safeName = file.name.normalize("NFKD").replace(/[^a-zA-Z0-9._-]+/g, "_").replace(/^_+|_+$/g, "") || "file";
    const unique = (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : Date.now() + "_" + Math.random().toString(36).slice(2);
    const path = `${section}/${direction}/${unique}_${safeName}`;

    const { error: uploadError } = await supabaseClient.storage
      .from(PLATFORM_STORAGE_BUCKET)
      .upload(path, file, { cacheControl: "3600", upsert: false });
    if (uploadError) throw uploadError;

    setMaterialManagerStatus("Файл загружен. Сохраняю запись...", "");

    const { error: insertError } = await supabaseClient.from(PLATFORM_MATERIALS_TABLE).insert({
      section, direction, material_type: "file", url: null, file_path: path, title: file.name, created_by: session.user.id
    });

    if (insertError) {
      await supabaseClient.storage.from(PLATFORM_STORAGE_BUCKET).remove([path]);
      throw insertError;
    }

    setMaterialManagerStatus("Файл успешно сохранён.", "ok");
    await loadDirectionMaterialsList();
    setTimeout(() => document.getElementById("materialManager")?.remove(), 700);
  } catch (error) {
    console.error("Ошибка загрузки файла:", error);
    setMaterialManagerStatus("Не удалось загрузить файл: " + (error.message || error), "error");
  } finally {
    setMaterialManagerBusy(false);
  }
}

async function renderAccess() {

    try {
      const { data: { session } } = await supabaseClient.auth.getSession();

      const { data, error } = await supabaseClient
        .from("access_periods")
        .select("status, payment_status, starts_at, ends_at, is_unlimited, granted_scope")
        .eq("profile_id", session.user.id)
        .order("starts_at", { ascending: false })

      const activePeriods = (data || []).filter(hasActivePlatformAccess);

      const itemStatus = (item) => {
        if (!item || !item.granted) return `<span style="color:#c9baa0;">закрыто</span>`;

        return active ? `<span style="color:#8fe3a1;">до ${date}</span>` : `<span style="color:#ff9d9d;">истёк ${date}</span>`;

      const dirRows = DIRECTIONS.map(function (d) {

          ${CONTENT_TYPES.map(c => `<td>${itemStatus(row[c.key])}</td>`).join("")}

      const table = `

        <table class="data-table">
          <thead><tr><th>Направление</th>${CONTENT_TYPES.map(c => `<th>${c.label}</th>`).join("")}</tr></thead>
          <tbody>${dirRows}</tbody>
        </table>

            <tr><td>Библиотека нумеролога</td><td>${itemStatus(scope.library)}</td></tr>

          </tbody>
        </table>

      document.getElementById("accessTable").innerHTML = activePeriods.length

let adminUsersFilterTeacher = null; // { id, name } — admin drilled into one numerologist's students

async function loadAdminUsers() {
  const box = document.getElementById("adminUsersTable");
  const accessSelect = document.getElementById("accessUserSelect");
  const roleSelect = document.getElementById("roleUserSelect");
  const attachStudentSelect = document.getElementById("attachStudentSelect");
  const attachTeacherSelect = document.getElementById("attachTeacherSelect");
  if (!box) return;
  box.innerHTML = '<div class="empty-table">Загрузка...</div>';

  const isRealAdmin = window.currentUserRole === "admin";
  const { data: { session } } = await supabaseClient.auth.getSession();

  let query = supabaseClient
    .from("profiles")
    .select("id, first_name, last_name, middle_name, email, phone, role, status, teacher_id, created_at")
    .order("last_name", { ascending: true });

  if (!isRealAdmin) query = query.eq("teacher_id", session.user.id);
  else if (adminUsersFilterTeacher) query = query.eq("teacher_id", adminUsersFilterTeacher.id);

  const { data, error } = await query;

  if (error) {
    console.error("Ошибка загрузки пользователей:", error);
    box.innerHTML = '<div class="empty-table">Не удалось загрузить пользователей.</div>';
    return;
  }

  const users = data || [];
  const nameOf = (u) => [u.last_name, u.first_name, u.middle_name].filter(Boolean).join(" ") || u.email || "Пользователь";

  // Селекты доступа/ролей всегда строятся из ПОЛНОГО списка, не из отфильтрованного вида.
  if (isRealAdmin && adminUsersFilterTeacher) {
    const { data: allData } = await supabaseClient
      .from("profiles")
      .select("id, first_name, last_name, middle_name, email, phone, role, status, teacher_id, created_at")
      .order("last_name", { ascending: true });
    fillAccessSelects(allData || [], nameOf);
  } else {
    fillAccessSelects(users, nameOf);
  }

  function fillAccessSelects(list, nameFn) {
    const fillSelect = (el, opts, emptyLabel) => {
      if (!el) return;
      el.innerHTML = opts.length
        ? opts.map(u => `<option value="${escapeHtml(u.id)}">${escapeHtml(nameFn(u))}${u.email ? " — " + escapeHtml(u.email) : ""}</option>`).join("")
        : `<option value="">${emptyLabel}</option>`;
    };
    fillSelect(accessSelect, list, "Нет пользователей");
    if (isRealAdmin) {
      fillSelect(roleSelect, list, "Нет пользователей");
      fillSelect(attachStudentSelect, list.filter(u => (u.role || "student") !== "numerologist" && (u.role || "student") !== "admin"), "Нет учениц");
      fillSelect(attachTeacherSelect, list.filter(u => u.role === "numerologist"), "Нет учителей");
    }
  }

  const backLink = (isRealAdmin && adminUsersFilterTeacher)
    ? `<button class="back-link" onclick='closeNumerologistDrilldown()'>← Все пользователи</button>`
    : "";

  if (!users.length) {
    box.innerHTML = backLink + `<div class="empty-table">${
      adminUsersFilterTeacher
        ? "У этого учителя пока нет учениц."
        : (isRealAdmin ? "Зарегистрированных пользователей пока нет." : "У вас пока нет учениц. Попросите администратора прикрепить их к вам.")
    }</div>`;
    return;
  }

  const teacherName = (teacherId) => {
    if (!teacherId) return "Не назначен";
    const t = users.find(u => u.id === teacherId);
    return t ? nameOf(t) : "—";
  };

  const teachersSorted = users
    .filter(u => u.role === "numerologist")
    .slice()
    .sort((a, b) => new Date(a.created_at || 0) - new Date(b.created_at || 0));
  const teacherNumber = {};
  teachersSorted.forEach((t, i) => { teacherNumber[t.id] = i + 1; });

  box.innerHTML = backLink + `
    <div style="overflow-x:auto;">
    <table class="data-table">
      <thead><tr><th>Пользователь</th><th>Email</th><th>Телефон</th><th>Роль</th>${isRealAdmin ? "<th>Учитель</th>" : ""}<th>Статус</th></tr></thead>
      <tbody>
        ${users.map(function (user) {
          const isClickableNumerologist = isRealAdmin && user.role === "numerologist" && !adminUsersFilterTeacher;
          const rowAttrs = isClickableNumerologist
            ? `style="cursor:pointer;" onclick='viewNumerologistStudents(${JSON.stringify(user.id)},${JSON.stringify(nameOf(user))})'`
            : "";
          const displayName = isClickableNumerologist
            ? `Учитель ${teacherNumber[user.id]} — ${escapeHtml(nameOf(user))} →`
            : escapeHtml(nameOf(user));
          return `<tr ${rowAttrs}>
            <td>${displayName}</td>
            <td>${escapeHtml(user.email || "—")}</td>
            <td>${escapeHtml(user.phone || "—")}</td>
            <td>${escapeHtml(user.role || "student")}</td>
            ${isRealAdmin ? `<td>${escapeHtml(teacherName(user.teacher_id))}</td>` : ""}
            <td>${escapeHtml(user.status || "—")}</td>
          </tr>`;
        }).join("")}
      </tbody>
    </table>
    </div>`;
}

const TERM_OPTIONS = [
  { value: "unlimited", label: "Бессрочно" },
  { value: "30", label: "1 месяц" },
  { value: "90", label: "3 месяца" },
  { value: "180", label: "6 месяцев" },
  { value: "365", label: "12 месяцев" }
];

function termSelectHtml(extraClass, attrs) {
  return `<select class="material-manager-input ${extraClass || ""}" ${attrs || ""} style="margin-bottom:0;padding:8px 10px;width:auto;">
    ${TERM_OPTIONS.map(t => `<option value="${t.value}">${t.label}</option>`).join("")}
  </select>`;
}

function computeEndsAt(termValue) {
  if (termValue === "unlimited") return { unlimited: true, ends_at: null };
  const days = Number(termValue);
  const d = new Date(Date.now() + days * 24 * 60 * 60 * 1000);
  return { unlimited: false, ends_at: d.toISOString() };
}

function toggleScopeAll(checked) {
  document.querySelectorAll(".scope-cell, .scope-flag").forEach(function (el) { el.checked = checked; });
}

function collectScope() {
  const scope = {};
  DIRECTIONS.forEach(function (d) { scope[d.key] = {}; });

  document.querySelectorAll(".scope-cell").forEach(function (el) {
    const dir = el.dataset.direction, type = el.dataset.type;
    if (!el.checked) { scope[dir][type] = { granted: false }; return; }
    const termSelect = document.querySelector(`.scope-term-row[data-direction="${dir}"]`);
    const term = termSelect ? termSelect.value : "unlimited";
    scope[dir][type] = Object.assign({ granted: true }, computeEndsAt(term));
  });

  const libChecked = document.getElementById("scopeLibrary")?.checked;
  const libTerm = document.getElementById("scopeLibraryTerm")?.value || "unlimited";
  scope.library = libChecked ? Object.assign({ granted: true }, computeEndsAt(libTerm)) : { granted: false };

  const calcChecked = document.getElementById("scopeMyCalc")?.checked;
  const calcTerm = document.getElementById("scopeMyCalcTerm")?.value || "unlimited";
  scope.my_calculations = calcChecked ? Object.assign({ granted: true }, computeEndsAt(calcTerm)) : { granted: false };

  return scope;
}

function scopeHasAnything(scope) {
  return Object.keys(scope).some(function (key) {
    if (key === "library" || key === "my_calculations") return !!scope[key]?.granted;
    return Object.values(scope[key] || {}).some(function (item) { return item && item.granted; });
  });
}

async function grantPlatformAccess() {
  const userId = document.getElementById("accessUserSelect")?.value || "";
  const message = document.getElementById("accessAdminMessage");

  const setMsg = function (text, ok) {
    if (!message) return;
    message.textContent = text;
    message.style.color = ok ? "#8fe3a1" : "#ff9d9d";
  };

  if (!userId) { setMsg("Сначала выберите пользователя.", false); return; }

  const scope = collectScope();
  if (!scopeHasAnything(scope)) { setMsg("Отметьте хотя бы один пункт доступа.", false); return; }

  setMsg("Выдаю доступ...", true);

  const startsAt = new Date();

  const { error: closeError } = await supabaseClient
    .from("access_periods")
    .update({ status: "expired" })
    .eq("profile_id", userId)
    .eq("status", "active");
  if (closeError) console.warn("Не удалось закрыть старый доступ:", closeError);

  // Срок хранится по каждому пункту внутри granted_scope,
  // поэтому сама запись access_periods — просто контейнер без общего срока.
  const { error } = await supabaseClient.from("access_periods").insert({
    profile_id: userId,
    status: "active",
    payment_status: "paid",
    starts_at: startsAt.toISOString(),
    ends_at: null,
    is_unlimited: true,
    granted_scope: scope
  });

  if (error) {
    console.error("Ошибка выдачи доступа:", error);
    setMsg("Не удалось выдать доступ: " + (error.message || "ошибка Supabase"), false);
    return;
  }

  setMsg("Доступ успешно выдан.", true);
  await loadAdminUsers();
}

  if (errorBox) errorBox.textContent = "";

async function registerUser() {
  const lastName = document.getElementById("registerLastName")?.value.trim() || "";
  const firstName = document.getElementById("registerFirstName")?.value.trim() || "";
  const middleName = document.getElementById("registerMiddleName")?.value.trim() || "";

  const email = document.getElementById("registerEmail")?.value.trim().toLowerCase() || "";
  const password = document.getElementById("registerPassword")?.value || "";
  const password2 = document.getElementById("registerPassword2")?.value || "";
  const message = document.getElementById("registerMessage");

  const setMessage = (text, ok = false) => {
    if (!message) return;
    message.textContent = text;
    message.className = "auth-message " + (ok ? "success" : "error");
  };

  if (!lastName || !firstName || !email || !password || !password2) {
    setMessage("Заполните обязательные поля: фамилия, имя, email и пароль.");
    return;
  }
  if (password.length < 6) { setMessage("Пароль должен содержать минимум 6 символов."); return; }
  if (password !== password2) { setMessage("Пароли не совпадают."); return; }

  setMessage("Создаю аккаунт...", true);

  const { data, error } = await supabaseClient.auth.signUp({
    email, password,
    options: {
      data: { first_name: firstName, last_name: lastName, middle_name: middleName, phone, role: "student", status: "pending" },
      emailRedirectTo: window.location.origin + window.location.pathname
    }
  });

  if (error) { setMessage(error.message || "Не удалось зарегистрировать пользователя."); return; }

  if (data?.user) {
    const { error: profileError } = await supabaseClient.from("profiles").upsert({
      id: data.user.id, first_name: firstName, last_name: lastName, middle_name: middleName,
      email, phone, role: "student", status: "pending"
    }, { onConflict: "id" });
    if (profileError) console.warn("Профиль не обновлён из браузера:", profileError);
  }

  if (data?.session) {
    setMessage("Регистрация завершена. Сейчас откроется платформа.", true);
    setTimeout(() => location.reload(), 900);
  } else {
    setMessage("Регистрация создана. Подтвердите email и войдите. Доступ к разделам откроет администратор или учитель.", true);
  }
}

let resetSent = false;

function showForgotPassword() {
  document.body.style.visibility = "visible";
  document.body.innerHTML = `
    <div class="auth-shell">
      <div class="auth-card">
        <div class="auth-symbol">✧</div>
        <div class="auth-title">NUMEROLOGY</div>
        <div class="auth-subtitle">Platform</div>
        <h2>Восстановление пароля</h2>
        <input id="resetEmail" type="email" placeholder="Введите ваш Email">
        <button type="button" onclick="sendPasswordReset()">Отправить ссылку</button>
        <div id="resetMessage" class="auth-message"></div>
        <button class="auth-link" type="button" onclick="showLogin()">← Вернуться ко входу</button>
      </div>
    </div>`;
  resetSent = false;
}

async function sendPasswordReset() {
  const email = document.getElementById("resetEmail")?.value.trim().toLowerCase();
  const message = document.getElementById("resetMessage");

  if (!email) {
    if (message) { message.textContent = "Введите ваш Email."; message.className = "auth-message error"; }
    return;
  }
  if (resetSent) {
    if (message) { message.textContent = "Ссылка уже была отправлена. Проверьте почту."; message.className = "auth-message success"; }
    return;
  }

  try {
    const { error } = await supabaseClient.auth.resetPasswordForEmail(email, {
      redirectTo: window.location.origin + window.location.pathname
    });
    if (error) throw error;
    resetSent = true;
    if (message) { message.textContent = "Ссылка для восстановления пароля отправлена на вашу почту."; message.className = "auth-message success"; }
  } catch (error) {
    console.error("Ошибка восстановления:", error);
    if (message) { message.textContent = error.message || "Не удалось отправить письмо."; message.className = "auth-message error"; }
  }
}

/* ============================================================
   АВТОМАТИЧЕСКИЙ ВЫХОД ПОСЛЕ 1 ЧАСА БЕЗДЕЙСТВИЯ
   ============================================================ */

const INACTIVITY_LIMIT = 60 * 60 * 1000;
const LAST_ACTIVITY_KEY = "numerology_last_activity";
let inactivityTimer = null;

function updateLastActivity() {
  localStorage.setItem(LAST_ACTIVITY_KEY, Date.now().toString());
  clearTimeout(inactivityTimer);
  inactivityTimer = setTimeout(autoLogoutAfterInactivity, INACTIVITY_LIMIT);
}

async function autoLogoutAfterInactivity() {
  const lastActivity = Number(localStorage.getItem(LAST_ACTIVITY_KEY) || 0);
  if (!lastActivity) { updateLastActivity(); return; }
  const inactiveTime = Date.now() - lastActivity;

  if (inactiveTime >= INACTIVITY_LIMIT) {
    localStorage.removeItem(LAST_ACTIVITY_KEY);
    try { await supabaseClient.auth.signOut(); } catch (error) { console.error("Ошибка автоматического выхода:", error); }
    showLogin();
    return;
  }
  clearTimeout(inactivityTimer);
  inactivityTimer = setTimeout(autoLogoutAfterInactivity, INACTIVITY_LIMIT - inactiveTime);
}

function startInactivityTimer() {
  const lastActivity = Number(localStorage.getItem(LAST_ACTIVITY_KEY) || 0);
  if (lastActivity && Date.now() - lastActivity >= INACTIVITY_LIMIT) { autoLogoutAfterInactivity(); return; }
  updateLastActivity();
}

["click", "keydown", "mousemove", "scroll", "touchstart"].forEach(function (eventName) {
  document.addEventListener(eventName, updateLastActivity, { passive: true });
});
document.addEventListener("visibilitychange", function () {
  if (!document.hidden) autoLogoutAfterInactivity();
});

async function logoutUser() {
  try { await supabaseClient.auth.signOut(); } catch (error) { console.error("Ошибка выхода:", error); }
  localStorage.removeItem(LAST_ACTIVITY_KEY);
  clearTimeout(inactivityTimer);
  window.currentUser = null;
  window.currentUserRole = "";
  window.currentUserIsManager = false;
  window.currentUserHasAccess = false;
  showLogin();
}

/* ============================================================
   ПРОВЕРКА АВТОРИЗАЦИИ ПРИ ЗАГРУЗКЕ
   ============================================================ */

async function checkAuth() {
  try {
    const { data: { session }, error: sessionError } = await supabaseClient.auth.getSession();
    if (sessionError) { console.error("Ошибка получения сессии:", sessionError); showLogin("Не удалось проверить авторизацию."); return; }
    if (!session) { showLogin(); return; }

    const user = session.user;
    window.currentUser = user;
    const userEmail = String(user.email || "").trim().toLowerCase();

    let profile = null;
    const { data: profileData, error: profileError } = await supabaseClient
      .from("profiles")
      .select("role, first_name, last_name, middle_name, email, phone, status")
      .eq("id", user.id)
      .maybeSingle();
    if (profileError) console.error("Ошибка загрузки профиля:", profileError);
    else profile = profileData;

    const role = String(profile?.role || user.user_metadata?.role || "student").trim().toLowerCase();
    const isManager = isManagerRole(role) || isAdminEmail(userEmail);

    let hasAccess = false;
    let currentGrant = {};
    if (isManager) {
      hasAccess = true;
    } else {
      const { data: access, error: accessError } = await supabaseClient
        .from("access_periods")
        .select("id, status, starts_at, ends_at, is_unlimited, payment_status, granted_scope")
        .eq("profile_id", user.id)
        .order("starts_at", { ascending: false });
      if (accessError) {
        console.error("Ошибка проверки доступа:", accessError);
      } else {
        const activePeriods = (access || []).filter(hasActivePlatformAccess);
        hasAccess = activePeriods.length > 0;
        currentGrant = activePeriods[0]?.granted_scope || {};
      }
    }

    window.currentUserRole = isAdminEmail(userEmail) ? "admin" : role;
    window.currentUserIsManager = isManager;
    window.currentUserHasAccess = hasAccess;
    window.currentUserGrant = currentGrant;

    const displayName = isManager
      ? "Центр Нумера"
      : (profile?.first_name || profile?.last_name || user.user_metadata?.first_name || userEmail.split("@")[0] || "Пользователь");

    const nameNode = document.getElementById("clientName");
    const emailNode = document.getElementById("clientEmail");
    if (nameNode) nameNode.textContent = displayName;
    if (emailNode) emailNode.textContent = profile?.email || user.email || "";

    const navStats = document.getElementById("navStatistics");
    if (navStats) navStats.style.display = window.currentUserIsManager ? "" : "none";

    document.body.style.visibility = "visible";
    startInactivityTimer();
    setActiveSection("calculators");
    renderCalculators();

  } catch (error) {
    console.error("Ошибка checkAuth:", error);
    showLogin("Не удалось подключиться к платформе. Проверьте соединение и попробуйте ещё раз.");
  }
}

document.addEventListener("DOMContentLoaded", checkAuth);
</script>
